[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "vantage-backend"
version = "0.1.0"
description = "Vantage API backend"
packages = [{include = "vantage"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = ">=0.115,<1"
uvicorn = {version = ">=0.32,<1", extras = ["standard"]}
anthropic = ">=1.0,<2"
sqlmodel = ">=0.0.21,<1"
websockets = ">=13,<15"
python-dotenv = "^1.2.3"

[tool.poetry.scripts]
vantage-backend = "vantage.main:run"
